name: worker-size

# The Worker bundle size budget in .worker-size.json, checked by devkit's shared worker-size.yml against
# `wrangler deploy --dry-run` of the build. No secret: a dry run never talks to the account.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@507d1be20e6cbf76badcfeaadf944818c66cf54f # v0.26.1
    with:
      prepare: npm run build

  # The admin MCP Worker in mcp/: its own npm package and lockfile, so its own install. devkit's bin comes from the
  # root install; the budget is mcp/.worker-size.json.
  mcp:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@507d1be20e6cbf76badcfeaadf944818c66cf54f # v0.26.1
    with:
      install: npm ci && npm ci --prefix mcp
      working-directory: mcp
      prepare: cp mcp/wrangler.jsonc.example mcp/wrangler.jsonc
