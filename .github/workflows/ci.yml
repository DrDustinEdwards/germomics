# CI gate. Runs on every push and PR. (Cloudflare Workers Builds still runs `npm run deploy`
# on push to main; this is the correctness/security gate that should pass before that.)
#
# TWO JOBS, NOT ONE, AND THE SPLIT IS THE POINT (2026-09-08).
#
# `verify` and `audit` used to be one job with the audit as its last step. The audit step had
# failed on EVERY run since 2026-07-27, six weeks, because three production advisories were
# reported and unactioned. That did not just leave the advisories open, it retired the whole
# gate: any typecheck or build regression in those six weeks arrived in a run that was already
# red, so there was no signal to notice. A permanently red gate gates nothing.
#
# What made it concrete: a CRITICAL advisory (GHSA-jrc7-96c5-q579, maplibre-gl) appeared on
# 2026-09-08 and produced NO new signal at all, because the line was already red. It was found
# by reading audit output by hand.
#
# Split, the two answer different questions and fail on their own lines. `verify` is "does this
# commit compile and build", which is about the change in front of you. `audit` is "has the
# dependency tree grown a new hole", which is about the world moving underneath you and often
# has nothing to do with the commit that surfaced it. Neither can now mask the other, and a new
# critical goes red on a line of its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Pinned by commit sha and time-limited (capsid residual 6, 2026-09-08).
    # A tag is a moving pointer its owner can repoint at any time, and a job with
    # no timeout-minutes inherits GitHub's 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        id: build
        run: npm run build

      # THE SUITE, ADDED 2026-09-08 (germomics/TASK-security-deps.md). It runs in the workers
      # pool because app/lib/sanitize.server.ts, the XSS boundary on every post body, is built
      # on the Workers HTMLRewriter global and cannot load under plain node. It runs AFTER the
      # typecheck deliberately: the typecheck now covers test/ too, and a test that stops
      # compiling would otherwise still report green, because the runner strips types rather
      # than checking them.
      - name: Test
        run: npm test

      # NO-BLOAT REPORTS (capsid/decisions.md "no bloat, as a standing plan", 2026-10-01).
      # WARN-ONLY BY RULING: they report against docs/no-bloat/baseline.json and never block a
      # merge. Every step is continue-on-error and scripts/nobloat.mjs always exits 0; a number
      # above the baseline is a warning annotation and a line in the job summary. They run
      # after the gate steps so they cannot change its result, and `!cancelled()` keeps them
      # reporting when a gate step failed. Together they add about 10 seconds: they reuse this
      # job's install and build rather than a job of their own.
      - name: Knip (warn-only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run --silent nobloat:knip

      - name: jscpd (warn-only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run --silent nobloat:jscpd

      - name: Page weight (warn-only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: npm run --silent nobloat:weight

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NOT `needs: verify`. A dependency advisory is independent of whether this
    # commit compiles, and chaining them would reintroduce the masking this split removes: a
    # broken build would skip the audit and a new critical would go unreported until it was
    # fixed.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fail only on high+ advisories in PRODUCTION deps. Dev-only advisories (the tracked
      # drizzle-kit chain) don't ship to the Worker, so --omit=dev keeps the gate meaningful
      # without blocking on them.
      #
      # Never raise --audit-level past high, and never drop this step. Both convert a known
      # problem into an unknown one, which is how six weeks of red happened in the first place.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high
