# CI gate. Runs on every push and PR, and a push to main that passes it deploys: D1 migrations first, then the
# Worker (the `deploy` job at the end).
#
# Advisories are not checked here: OSV-Scanner (dependencies.yml) fails a pull request on any advisory the change adds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Pinned by commit sha and time-limited (capsid residual 6, 2026-09-08).
    # A tag is a moving pointer its owner can repoint at any time, and a job with
    # no timeout-minutes inherits GitHub's 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Oxlint with devkit's shared config (oxlint.config.ts), type-aware, so after the typecheck that writes the
      # wrangler and React Router types it reads.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        id: build
        run: npm run build

      # The suite runs after the typecheck on purpose: the typecheck covers test/ too, and a test that stops
      # compiling would otherwise still report green, because the runner strips types rather than checking them.
      - name: Test
        run: npm test

      # Area 8: raw console.* calls in server code may not rise above .console.json's baseline (devkit-console; the
      # structured logger is site-runtime ./log), and a migration already in drizzle/ is never edited, renamed or
      # deleted, and a new one only adds unless it says `-- contract: <reason>` (devkit-migrations, drizzle/manifest.json).
      - name: Console ratchet
        run: npm run --silent check:console

      - name: Migrations are expand-only
        run: npm run --silent check:migrations

      # NO-BLOAT RATCHET (capsid/decisions.md "no bloat, as a standing plan", 2026-10-01).
      # devkit-no-bloat fails the job when a Knip, jscpd or shared-copies count is off .no-bloat.json's baseline.
      # Page weight is a gate too (area 7, D5: every React app fails CI over its route budget): devkit-route-weight
      # fails the job when a route passes .route-weight.json's budget_bytes or grows past its baseline.
      # `!cancelled()` keeps both reporting when an earlier step failed. Together they add about 10 seconds: they
      # reuse this job's install and build rather than a job of their own.
      - name: Knip and jscpd
        if: ${{ !cancelled() }}
        run: npm run --silent nobloat

      - name: Page weight
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run --silent nobloat:weight

  # A merge to main deploys once verify is green: migrations first, then the Worker, so a migration is never a
  # manual step. Dormant until the repo variable CF_DEPLOY is 'true' (with the secrets CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID), so Cloudflare Workers Builds keeps deploying until it is turned off; turn it off before
  # setting CF_DEPLOY, or both deploy each merge.
  # devkit's shared deploy (worker-deploy.yml): it reads the D1 Time Travel bookmark (`d1-database`), so a bad
  # migration is one restore to undo, applies the pending migrations that only add (devkit-migrations --apply; a
  # drop, rename or row delete is refused with the command to run it by hand) and builds, deploys with
  # DEPLOY_SHA set to this commit, waits for /health to report it, checks the home page answers, and rolls the deploy
  # back if it does not. A rollback never undoes a migration, so migrations stay additive.
  deploy:
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@e96231d7bfa3ba1354039804403c47696c71fbc1 # v0.68.0
    with:
      worker-name: germomics
      # site-runtime withAdminIdle's key, minted once by the deploy and never shown (devkit "generated-secrets").
      generated-secrets: ADMIN_IDLE_SECRET
      d1-database: germomics
      health-url: https://germomics.com/health
      keep-assets: build/client
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://germomics.com/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      pre-deploy: >-
        npx devkit-migrations drizzle --apply germomics &&
        npm run build
      sha-var: DEPLOY_SHA
      # Gradual rollout (D4): the new version takes 10% of traffic for 10 minutes before the live gate judges it and it
      # takes all traffic; a refused one is rolled back to the version it shared traffic with. A deploy that adds a
      # Durable Object migration (wrangler.jsonc) sets gradual-percent to 0 for that deploy.
      gradual-percent: 10
      # No preview per pull request (D6): Cloudflare makes no preview URL for a Worker that has a Durable Object, and
      # germomics has one (RateLimiter). Stated, so it is not mistaken for forgotten.
      preview: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
