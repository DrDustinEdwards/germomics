# CI gate. Runs on every push and PR, and a push to main that passes it deploys: D1 migrations first, then the
# Worker (the `deploy` job at the end).
#
# TWO JOBS, NOT ONE, AND THE SPLIT IS THE POINT (2026-09-08).
#
# `verify` and `audit` used to be one job with the audit as its last step. The audit step had
# failed on EVERY run since 2026-07-27, six weeks, because three production advisories were
# reported and unactioned. That did not just leave the advisories open, it retired the whole
# gate: any typecheck or build regression in those six weeks arrived in a run that was already
# red, so there was no signal to notice. A permanently red gate gates nothing.
#
# What made it concrete: a CRITICAL advisory (GHSA-jrc7-96c5-q579, maplibre-gl) appeared on
# 2026-09-08 and produced NO new signal at all, because the line was already red. It was found
# by reading audit output by hand.
#
# Split, the two answer different questions and fail on their own lines. `verify` is "does this
# commit compile and build", which is about the change in front of you. `audit` is "has the
# dependency tree grown a new hole", which is about the world moving underneath you and often
# has nothing to do with the commit that surfaced it. Neither can now mask the other, and a new
# critical goes red on a line of its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Pinned by commit sha and time-limited (capsid residual 6, 2026-09-08).
    # A tag is a moving pointer its owner can repoint at any time, and a job with
    # no timeout-minutes inherits GitHub's 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        id: build
        run: npm run build

      # THE SUITE, ADDED 2026-09-08 (germomics/TASK-security-deps.md). It runs in the workers
      # pool because app/lib/sanitize.server.ts, the XSS boundary on every post body, is built
      # on the Workers HTMLRewriter global and cannot load under plain node. It runs AFTER the
      # typecheck deliberately: the typecheck now covers test/ too, and a test that stops
      # compiling would otherwise still report green, because the runner strips types rather
      # than checking them.
      - name: Test
        run: npm test

      # Area 8: raw console.* calls in server code may not rise above .console.json's baseline (devkit-console; the
      # structured logger is site-runtime ./log), and a migration already in drizzle/ is never edited, renamed or
      # deleted, and a new one only adds unless it says `-- contract: <reason>` (devkit-migrations, drizzle/manifest.json).
      - name: Console ratchet
        run: npm run --silent check:console

      - name: Migrations are expand-only
        run: npm run --silent check:migrations

      # NO-BLOAT REPORTS (capsid/decisions.md "no bloat, as a standing plan", 2026-10-01).
      # Knip and jscpd stay warn-only: devkit-no-bloat --warn-only reports against .no-bloat.json's baseline and
      # always exits 0. Page weight is a gate (area 7, D5: every React app fails CI over its route budget):
      # devkit-route-weight fails the job when a route passes .route-weight.json's budget_bytes or grows past its
      # baseline. `!cancelled()` keeps both reporting when an earlier step failed. Together they add about 10
      # seconds: they reuse this job's install and build rather than a job of their own.
      - name: Knip and jscpd (warn-only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run --silent nobloat

      - name: Page weight
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run --silent nobloat:weight

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NOT `needs: verify`. A dependency advisory is independent of whether this
    # commit compiles, and chaining them would reintroduce the masking this split removes: a
    # broken build would skip the audit and a new critical would go unreported until it was
    # fixed.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fail only on high+ advisories in PRODUCTION deps. Dev-only advisories (the tracked
      # drizzle-kit chain) don't ship to the Worker, so --omit=dev keeps the gate meaningful
      # without blocking on them.
      #
      # Never raise --audit-level past high, and never drop this step. Both convert a known
      # problem into an unknown one, which is how six weeks of red happened in the first place.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  # A merge to main deploys once both jobs are green: migrations first, then the Worker, so a migration is never a
  # manual step. Dormant until the repo variable CF_DEPLOY is 'true' (with the variables VITE_GOOGLE_MAPS_KEY and
  # VITE_GOOGLE_MAPS_MAP_ID and the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID), so Cloudflare Workers Builds keeps deploying until it is turned off; turn it off before
  # setting CF_DEPLOY, or both deploy each merge.
  # devkit's shared deploy (worker-deploy.yml): it reads the D1 Time Travel bookmark (`d1-database`), so a bad
  # migration is one restore to undo, applies the pending migrations that only add (devkit-migrations --apply; a
  # drop, rename or row delete is refused with the command to run it by hand) and builds, deploys with
  # DEPLOY_SHA set to this commit, waits for /health to report it, checks the home page answers, and rolls the deploy
  # back if it does not. A rollback never undoes a migration, so migrations stay additive (CLAUDE.md, hard rule 2).
  deploy:
    needs: [verify, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@8390c62de180aa316f12d141a0cc42d00a714f74 # v0.20.23
    with:
      worker-name: germomics
      d1-database: germomics
      health-url: https://germomics.com/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://germomics.com/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      # The Maps key and Map ID are BUILD-time values Vite inlines into the client bundle (wrangler.jsonc, .env.example),
      # so they come from repo variables (public by construction, referrer-restricted) and a deploy without the key stops.
      pre-deploy: >-
        export VITE_GOOGLE_MAPS_KEY='${{ vars.VITE_GOOGLE_MAPS_KEY }}' VITE_GOOGLE_MAPS_MAP_ID='${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}' &&
        { [ -n "$VITE_GOOGLE_MAPS_KEY" ] || { echo "::error::the repo variable VITE_GOOGLE_MAPS_KEY is not set, so the maps would not render"; exit 1; }; } &&
        npx devkit-migrations drizzle --apply germomics &&
        npm run build
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
