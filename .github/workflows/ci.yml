# CI gate — runs on every push and PR. Type-checks, builds, and audits production
# dependencies. (Cloudflare Workers Builds still runs `npm run deploy` on push to main;
# this is the correctness/security gate that should pass before that.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Pinned by commit sha and time-limited (capsid residual 6, 2026-09-08).
    # A tag is a moving pointer its owner can repoint at any time, and a job with
    # no timeout-minutes inherits GitHub's 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fail only on high+ advisories in PRODUCTION deps. Dev-only advisories (the tracked
      # drizzle-kit chain) don't ship to the Worker, so --omit=dev keeps the gate meaningful
      # without blocking on them.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high
