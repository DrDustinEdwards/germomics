name: CI (admin MCP)

# The Germomics Admin MCP Worker in mcp/: its own package and lockfile, so its own job.
on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/ci-mcp.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/ci-mcp.yml"

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ci-mcp-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      # wrangler.jsonc is gitignored; typegen and the dry-run build need one.
      - name: Stage wrangler config
        run: cp wrangler.jsonc.example wrangler.jsonc
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Typecheck is not a build: the dry run bundles, so a runtime dependency
      # missing from package.json fails here.
      - name: Build (dry run, no deploy)
        run: npm run build

  # The official MCP conformance suite (devkit-conformance, .conformance.json) against the real protocol layer under
  # wrangler dev, and the door's authorization server: a regression against the recorded baseline fails.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run check:conformance

  # devkit's shared deploy (worker-deploy.yml), as the web Worker's in ci-cf.yml: a merge to main deploys
  # germomics-admin-mcp with DEPLOY_SHA set, waits for /health to report it, checks the live door, and rolls
  # it back on a refusal. The pre-deploy stages wrangler.jsonc from the example and fills the OAUTH_KV id
  # by the namespace's title, so no id is committed or kept in GitHub. Dormant until CF_DEPLOY is 'true'.
  deploy:
    needs: [check, conformance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    permissions:
      contents: read
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@4d0c8fdb2f1794272b31d3c4354059eb2f19a26a # v0.22.0
    with:
      worker-name: germomics-admin-mcp
      # site-runtime audit-log's signing key (0.84), minted once by the deploy and never shown (devkit "generated-secrets").
      generated-secrets: AUDIT_SIGNING_KEY
      health-url: https://admin-mcp.germomics.com/health
      working-directory: mcp
      pre-deploy: >-
        id=$(npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s.slice(s.indexOf("["))).find(k=>k.title==="germomics-admin-mcp-oauth");if(!n){console.error("::error::no KV namespace titled germomics-admin-mcp-oauth");process.exit(1)}process.stdout.write(n.id)})') &&
        sed -e "s|YOUR_OAUTH_KV_ID|$id|" wrangler.jsonc.example > wrangler.jsonc
      # The live door: the protected-resource metadata names /mcp, a foreign Origin is refused 403 before
      # any token check, and a bare request is a 401. Exit 0 passes, 1 refuses (rolls back), 3 could not run.
      verify-command: >-
        o=https://admin-mcp.germomics.com;
        prm=$(curl -s --max-time 20 "$o/.well-known/oauth-protected-resource/mcp") || exit 3;
        echo "$prm" | grep -q "\"resource\":\"$o/mcp\"" || { echo "::error::metadata does not name $o/mcp"; exit 1; };
        evil=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{}' "$o/mcp");
        [ "$evil" = 403 ] || { echo "::error::foreign Origin answered $evil, not 403"; exit 1; };
        bare=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' "$o/mcp");
        [ "$bare" = 401 ] || { echo "::error::no token answered $bare, not 401"; exit 1; };
        echo "admin MCP verified live at $o"
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
