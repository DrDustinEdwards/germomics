name: restore-drill

# The weekly restore drill (devkit's restore-drill.yml): the newest complete nightly dump in germomics-backups is
# downloaded, restored into a scratch SQLite file and checked, FTS5 search included (d1-dump README, "Restore drill").
# The token reads the backups bucket only (R2: Read), so the drill can download a dump and change nothing.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@cd31a3eba261e27aa5f4b7a9965f7c4fc59ebe49 # v0.21.5
    with:
      bucket: germomics-backups
      d1-dump-ref: v0.8.0
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
