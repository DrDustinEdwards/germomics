<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Rabies virus enters at a bite, moves back along a peripheral nerve toward the central nervous system, and can spread outward again, including to saliva."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="680" height="190">
      <title>How rabies virus moves through the body</title>
      <desc>
        Rabies virus enters at a bite, moves back along a peripheral nerve toward the central
        nervous system, and can spread outward again, including to saliva.
      </desc>
      <defs>
        <marker
          id="arrow-rabiesdayout"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="6"

        >
          <path d="M0 0 L10 5 L0 10 Z" class="arrow-head" />
        </marker>
      </defs>
      <g class="node-warning">
        <rect x="24" y="20" width="150" height="140" rx="8" />
        <path class="glyph" d="M40 62 C62 50 70 50 92 62" />
        <path class="glyph" d="M40 88 C62 100 70 100 92 88" />
        <path class="glyph" d="M92 62 L108 75 L92 88" />
        <circle class="mark" cx="100" cy="70" r="3" />
        <circle class="mark" cx="112" cy="62" r="3" />
        <text class="label-primary" x="99.0" y="132" text-anchor="middle">Enters at a bite</text>
        <text class="label-secondary" x="99.0" y="148" text-anchor="middle">
          through broken skin
        </text>
      </g>
      <path d="M174 90 H186" class="connector" marker-end="url(#arrow-rabiesdayout)" />
      <g class="node-info">
        <rect x="186" y="20" width="150" height="140" rx="8" />

        <circle class="mark" cx="230" cy="70" r="3.5" />

        <circle class="mark" cx="294" cy="70" r="3.5" />
        <text class="label-primary" x="261.0" y="132" text-anchor="middle">Moves back</text>
        <text class="label-secondary" x="261.0" y="148" text-anchor="middle">along the nerve</text>
      </g>
      <path d="M336 90 H360" class="connector" marker-end="url(#arrow-rabiesdayout)" />
      <g class="node-accent">
        <rect x="360" y="20" width="170" height="140" rx="8" />

        <text class="label-secondary" x="445.0" y="148" text-anchor="middle">
          including to saliva
        </text>
      </g>
    </svg>

      >World Health Organization, Rabies fact sheet</a
    >.
  </p>
</div>
