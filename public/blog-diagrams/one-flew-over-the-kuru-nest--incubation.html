<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Kuru has a very long incubation period. From an exposure, often in childhood, the average was about a dozen years, and some cases appeared after 50 years or more. Symptoms of lost coordination and tremor then lead to death, usually within a year or so."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 226" width="680" height="226">
      <title>Kuru: the incubation period</title>
      <desc>
        Kuru has a very long incubation period. From an exposure, often in childhood, the average
        was about a dozen years, and some cases appeared after 50 years or more. Symptoms of lost
        coordination and tremor then lead to death, usually within a year or so.
      </desc>
      <path class="ln" d="M70 120H630" />
      <g transform="translate(630 120)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <path class="ln muted" d="M70 116V124" />
      <text class="label-secondary" x="70" y="142" text-anchor="middle">0</text>
      <path class="ln muted" d="M170 116V124" />
      <text class="label-secondary" x="170" y="142" text-anchor="middle">10</text>
      <path class="ln muted" d="M270 116V124" />
      <text class="label-secondary" x="270" y="142" text-anchor="middle">20</text>
      <path class="ln muted" d="M370 116V124" />
      <text class="label-secondary" x="370" y="142" text-anchor="middle">30</text>
      <path class="ln muted" d="M470 116V124" />
      <text class="label-secondary" x="470" y="142" text-anchor="middle">40</text>
      <path class="ln muted" d="M570 116V124" />
      <text class="label-secondary" x="570" y="142" text-anchor="middle">50</text>
      <text class="label-secondary" x="630" y="160" text-anchor="end">years after exposure</text>
      <g transform="translate(70 50) scale(0.9)">
        <circle class="ln" cx="0" cy="-14" r="6.5" />
        <path
          class="ln tint-brand"
          d="M-5 -6.5H5C10 -6.5 12 -3 12 1L13 14H8L7 30H1.5L0 15L-1.5 30H-7L-8 14H-13L-12 1C-12 -3 -10 -6.5 -5 -6.5Z"
        />
      </g>
      <text class="label-primary" x="96" y="40" text-anchor="start">exposure</text>
      <text class="label-secondary" x="96" y="57" text-anchor="start">in childhood or later</text>
      <rect class="ln brand tint2-brand" x="70" y="90" width="120" height="14" rx="7" />
      <path class="ln brand" d="M190 97H630" stroke-dasharray="3 4" />
      <g transform="translate(630 97)"><path class="ln brand" d="M-4 -6L3 0L-4 6" /></g>
      <text class="label-primary" x="200" y="82" text-anchor="start">
        about 12 years on average
      </text>
      <text class="label-secondary" x="630" y="82" text-anchor="end">
        some cases 50 years or more
      </text>
      <text class="label-secondary" x="70" y="198" text-anchor="start">
        Then symptoms: loss of coordination and tremor. Death usually follows within a year or so.
      </text>
    </svg>
  </figure>

      >Collinge and colleagues, The Lancet (2006)</a
    >;
    <a href="https://doi.org/10.33321/cdi.2005.29.46"
      >Alpers, Communicable Diseases Intelligence (2005)</a
    >.
  </p>
</div>
