<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Kuru has a very long incubation period. From an exposure, often in childhood, the average was about a dozen years, and some cases appeared after 50 years or more. Symptoms of lost coordination and tremor then lead to death, usually within a year or so."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 206" width="680" height="206">
      <title>Kuru: the incubation period</title>
      <desc>
        Kuru has a very long incubation period. From an exposure, often in childhood, the average
        was about a dozen years, and some cases appeared after 50 years or more. Symptoms of lost
        coordination and tremor then lead to death, usually within a year or so.
      </desc>
      <path class="ln" d="M70 110H640" />
      <g transform="translate(640 110)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <path class="ln muted" d="M70 106V114" />
      <text class="label-secondary" x="70" y="130" text-anchor="middle">0</text>
      <path class="ln muted" d="M170 106V114" />
      <text class="label-secondary" x="170" y="130" text-anchor="middle">10</text>
      <path class="ln muted" d="M270 106V114" />
      <text class="label-secondary" x="270" y="130" text-anchor="middle">20</text>
      <path class="ln muted" d="M370 106V114" />
      <text class="label-secondary" x="370" y="130" text-anchor="middle">30</text>
      <path class="ln muted" d="M470 106V114" />
      <text class="label-secondary" x="470" y="130" text-anchor="middle">40</text>
      <path class="ln muted" d="M570 106V114" />
      <text class="label-secondary" x="570" y="130" text-anchor="middle">50</text>
      <text class="label-secondary" x="640" y="146" text-anchor="end">years after exposure</text>
      <circle class="ln brand tint-brand" cx="70" cy="110" r="6" />
      <text class="label-primary" x="70" y="62" text-anchor="start">an exposure,</text>
      <text class="label-secondary" x="70" y="78" text-anchor="start">in childhood or later</text>
      <path class="ln m-draw brand" pathLength="1" style="--i: 0" d="M76 98H190" />
      <path class="ln brand" d="M190 98H630" stroke-dasharray="3 4" />
      <circle class="ln brand tint-brand" cx="190" cy="98" r="4" />
      <text class="label-primary" x="198" y="68" text-anchor="start">
        about a dozen years on average
      </text>
      <text class="label-secondary" x="630" y="68" text-anchor="end">
        some cases: 50 years or more
      </text>
      <g transform="translate(630 98)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <text class="label-secondary" x="340" y="190" text-anchor="middle">
        Then symptoms: loss of coordination and tremor, and death usually within a year or so.
      </text>
    </svg>
  </figure>
  <p class="blog-diagram-credit">

    >;

      >Collinge and colleagues, The Lancet (2006)</a
    >.
  </p>
</div>
