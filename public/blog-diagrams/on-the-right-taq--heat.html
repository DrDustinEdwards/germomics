<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="A PCR cycle swings between heat that separates the DNA strands, a cooler step where primers bind, and a middle step where the polymerase copies. Taq polymerase comes from Thermus aquaticus, a bacterium of hot springs. It is heat-stable, so the reaction can run at higher temperatures."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190">
      <title>Why PCR uses a heat-stable polymerase</title>
      <desc>
        A PCR cycle swings between heat that separates the DNA strands, a cooler step where primers
        bind, and a middle step where the polymerase copies. Taq polymerase comes from Thermus
        aquaticus, a bacterium of hot springs. It is heat-stable, so the reaction can run at higher
        temperatures.
      </desc>
      <path class="ln" d="M50 24V150H440" />
      <g transform="translate(440 150)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(50 22)"><path class="ln muted" d="M-4 6L0 0L4 6" /></g>
      <text class="label-secondary" x="42" y="70" text-anchor="end">heat</text>
      <path class="ln rule-line muted" d="M50 44H440" stroke-dasharray="1 5" />
      <path class="ln rule-line muted" d="M50 84H440" stroke-dasharray="1 5" />
      <path class="ln rule-line muted" d="M50 112H440" stroke-dasharray="1 5" />
      <path
        class="ln m-draw accent"
        pathLength="1"
        style="--i: 0"
        d="M50 112L70 44H110L130 112H170L190 84H240L260 44H300L320 112H360L380 84H430"
      />
      <text class="label-secondary" x="90" y="36" text-anchor="middle">denature</text>
      <text class="label-secondary" x="150" y="128" text-anchor="middle">anneal</text>
      <text class="label-secondary" x="215" y="76" text-anchor="middle">extend</text>
      <text class="label-secondary" x="245" y="172" text-anchor="middle">
        temperature over repeated cycles, not to scale
      </text>
      <g class="m-fade" style="--i: 1">
        <g transform="translate(510 62)">
          <circle class="ln accent tint-accent" r="10" />
          <path class="ln accent" d="M-4 0L-1 3L5 -4" />
        </g>
      </g>
      <text class="label-primary" x="534" y="52" text-anchor="start">Taq polymerase</text>
      <text class="label-secondary" x="534" y="70" text-anchor="start">
        from Thermus aquaticus,
      </text>
      <text class="label-secondary" x="534" y="85" text-anchor="start">a hot-spring bacterium</text>
      <text class="label-secondary" x="534" y="118" text-anchor="start">
        heat-stable, so the reaction
      </text>
      <text class="label-secondary" x="534" y="133" text-anchor="start">
        can run at higher temperatures
      </text>
    </svg>
  </figure>
  <p class="blog-diagram-credit">
    Sources:

    <a href="https://doi.org/10.1128/jb.98.1.289-297.1969"
      >Brock and Freeze, Journal of Bacteriology (1969)</a
    >.
  </p>
</div>
