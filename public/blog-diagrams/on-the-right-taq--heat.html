    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 222" width="680" height="222">
      <title>Why PCR uses a heat-stable polymerase</title>
      <desc>A PCR cycle denatures the DNA at about 94 to 98 degrees Celsius, anneals primers at 50 to 65, and extends at about 72. Taq polymerase comes from Thermus aquaticus, a bacterium of hot springs. It is heat-stable, so the hot denaturation step does not inactivate it.</desc>
