      <title>One cycle of PCR</title>
      <desc>

        separating the two DNA strands. Anneal is primers binding, at a temperature that depends on
        the primers. Extend is Taq polymerase, from Thermus aquaticus, copying each strand and
        staying active through the heat. Repeat is those copies becoming templates.
      </desc>
