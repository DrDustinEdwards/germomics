<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="One cycle of PCR. Heat separates the two DNA strands, primers bind, Taq polymerase copies each strand, and those copies become the next templates."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 188" width="680" height="188">
      <title>One cycle of PCR</title>
      <desc>
        One cycle of PCR. Heat separates the two DNA strands, primers bind, Taq polymerase copies
        each strand, and those copies become the next templates.
      </desc>
      <defs>
        <marker
          id="arrow-ontherighttaq"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="6"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <path d="M0 0 L10 5 L0 10 Z" class="arrow-head" />
        </marker>
      </defs>
      <g class="node-accent">
        <rect x="16" y="16" width="148" height="132" rx="8" />
        <path class="glyph" d="M36 52 C58 52 64 40 92 36" />
        <path class="glyph" d="M36 72 C58 72 64 84 92 88" />
        <text class="label-primary" x="90.0" y="120" text-anchor="middle">Denature</text>
        <text class="label-secondary" x="90.0" y="136" text-anchor="middle">strands separate</text>
      </g>
      <path d="M164 82 H178" class="connector" marker-end="url(#arrow-ontherighttaq)" />
      <g class="node-info">
        <rect x="178" y="16" width="148" height="132" rx="8" />
        <path class="glyph" d="M186 44 H292" />
        <path class="glyph" d="M186 80 H292" />
        <path class="glyph primer" d="M196 44 H230" />
        <path class="glyph primer" d="M250 80 H284" />
        <text class="label-primary" x="252.0" y="120" text-anchor="middle">Anneal</text>
        <text class="label-secondary" x="252.0" y="136" text-anchor="middle">primers bind</text>
      </g>
      <path d="M326 82 H340" class="connector" marker-end="url(#arrow-ontherighttaq)" />
      <g class="node-success">
        <rect x="340" y="16" width="148" height="132" rx="8" />
        <path class="glyph" d="M348 42 H454" />
        <path class="glyph" d="M348 82 H454" />
        <path class="glyph primer" d="M360 50 H430" />
        <path class="glyph primer" d="M372 74 H442" />
        <circle class="enzyme" cx="434" cy="50" r="4" />
        <circle class="enzyme" cx="366" cy="74" r="4" />
        <text class="label-primary" x="414.0" y="120" text-anchor="middle">Extend</text>
        <text class="label-secondary" x="414.0" y="136" text-anchor="middle">Taq copies</text>
      </g>
      <path d="M488 82 H502" class="connector" marker-end="url(#arrow-ontherighttaq)" />
      <g class="node-neutral">
        <rect x="502" y="16" width="148" height="132" rx="8" />
        <path class="glyph" d="M510 40 H616" />
        <path class="glyph primer" d="M510 48 H616" />
        <path class="glyph" d="M510 68 H616" />
        <path class="glyph primer" d="M510 76 H616" />
        <text class="label-primary" x="576.0" y="120" text-anchor="middle">Repeat</text>
        <text class="label-secondary" x="576.0" y="136" text-anchor="middle">
          copies are templates
        </text>
      </g>
    </svg>
  </figure>

    >.
  </p>
</div>
