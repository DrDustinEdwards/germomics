    role="img"
    aria-label="Influenza A viruses are divided into subtypes by two surface proteins. Hemagglutinin, H, binds sialic acid receptors on the host cell. Neuraminidase, N, cleaves sialic acid and frees new virus from the cell. Drift is the accumulation of point mutations in the H and N genes, which changes their antigenic properties a little at a time. In shift, a cell infected by two viruses can reassort gene segments between them, giving a new mix of segments."

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
      <title>Influenza A: surface proteins, drift and shift</title>
      <desc>
        Influenza A viruses are divided into subtypes by two surface proteins. Hemagglutinin, H,
        binds sialic acid receptors on the host cell. Neuraminidase, N, cleaves sialic acid and
        frees new virus from the cell. Drift is the accumulation of point mutations in the H and N
        genes, which changes their antigenic properties a little at a time. In shift, a cell
        infected by two viruses can reassort gene segments between them, giving a new mix of
        segments.
      </desc>
