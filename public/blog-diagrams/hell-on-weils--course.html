    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
      <title>The two phases of leptospirosis</title>
      <desc>
        Leptospirosis often runs in two phases. In the first, bacteria are in the blood, with fever,
        headache and muscle pain. A brief lull can follow. In the second, immune phase, most illness
        stays mild, and some people develop Weil's disease, the severe form, with jaundice, kidney
        failure and bleeding.
      </desc>

        pathLength="1"

        d="M86 140C100 140 106 70 135 70C170 70 175 130 205 132C235 134 255 100 295 100C335 100 345 140 380 140"
      />
      <text class="label-secondary" x="86" y="50" text-anchor="start">symptoms</text>
      <path class="ln brand" d="M70 168V176H186V168" />
      <text class="label-primary" x="130.0" y="196" text-anchor="middle">Blood phase</text>
      <path class="ln muted" d="M190 168V176H246V168" />
      <text class="label-primary" x="220.0" y="196" text-anchor="middle">Lull</text>
      <path class="ln accent" d="M250 168V176H386V168" />
      <text class="label-primary" x="320.0" y="196" text-anchor="middle">Immune phase</text>
      <text class="label-secondary" x="130" y="214" text-anchor="middle">fever, headache,</text>
      <text class="label-secondary" x="130" y="229" text-anchor="middle">muscle pain</text>
      <text class="label-secondary" x="220" y="214" text-anchor="middle">a brief</text>
      <text class="label-secondary" x="220" y="229" text-anchor="middle">pause</text>
      <text class="label-secondary" x="320" y="214" text-anchor="middle">
        mostly mild; some develop
      </text>
      <text class="label-secondary" x="320" y="229" text-anchor="middle">
        Weil's disease: jaundice,
      </text>
      <text class="label-secondary" x="320" y="244" text-anchor="middle">
        kidney failure, bleeding
      </text>
      <circle class="ln brand tint-brand" cx="40" cy="150" r="5" />
      <text class="label-secondary" x="14" y="134" text-anchor="start">exposure</text>
    </svg>
  </figure>
