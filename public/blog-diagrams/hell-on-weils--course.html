    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 206" width="680" height="206">
      <title>The two phases of leptospirosis</title>
      <desc>
        Leptospirosis often runs in two phases. In the first, bacteria are in the blood, with fever,
        headache and muscle pain. A brief lull can follow. In the second, immune phase, most illness
        stays mild, and some people develop Weil's disease, the severe form, with jaundice, kidney
        failure and bleeding.
      </desc>

      <circle class="ln muted tint-ink" cx="60" cy="150" r="4" />
      <text class="label-secondary" x="60" y="168" text-anchor="middle">exposure</text>
      <text class="label-secondary" x="148" y="168" text-anchor="middle">days</text>
      <text class="label-secondary" x="310" y="168" text-anchor="middle">weeks</text>
      <path class="ln muted" d="M148 150v5M228 150v5M310 150v5" />

      <g>
        <text class="label-secondary" x="131" y="64" text-anchor="middle">
          bacteria in the blood:
        </text>
        <text class="label-secondary" x="131" y="79" text-anchor="middle">
          fever, headache, muscle pain
        </text>
      </g>
      <path class="ln muted" d="M204 46V38H252V46" />
      <text class="label-primary" x="228" y="28" text-anchor="middle">A lull</text>
      <g>
        <text class="label-secondary" x="228" y="64" text-anchor="middle">a brief</text>
        <text class="label-secondary" x="228" y="79" text-anchor="middle">improvement</text>
      </g>
      <path class="ln muted" d="M262 46V38H398V46" />
      <text class="label-primary" x="330" y="28" text-anchor="middle">Immune phase</text>
      <g>
        <text class="label-secondary" x="330" y="64" text-anchor="middle">
          antibodies appear and the
        </text>

        </text>
      </g>

      <text class="label-primary" x="560" y="48" text-anchor="middle">Weil's disease</text>
