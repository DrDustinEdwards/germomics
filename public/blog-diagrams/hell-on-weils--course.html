      <title>The two phases of leptospirosis</title>
      <desc>Leptospirosis often runs in two phases. In the first, bacteria are in the blood, with fever, headache and muscle pain. A brief lull can follow. In the second, immune phase, most illness stays mild, and some people develop Weil's disease, the severe form, with jaundice, kidney failure and bleeding.</desc>

="label-primary" x="560" y="48" text-anchor="middle">Weil's disease</text><text class="label-secondary" x="560" y="66" text-anchor="middle">the severe form</text><g><text class="label-secondary" x="512" y="100" text-anchor="start">jaundice</text><text class="label-secondary" x="512" y="132" text-anchor="start">kidney failure</text><text class="label-secondary" x="512" y="164" text-anchor="start">bleeding is common</text></g><g transform="translate(492 96)"><path class="ln brand tint2-brand" d="M-14 0C-8 -8 8 -8 14 0C8 8 -8 8 -14 0Z" /><circle class="ln brand" cx="0" cy="0" r="4.5" /></g><g transform="translate(488 112) scale(0.34)"><path class="ln brand tint-brand" d="M10 -44C34 -44 46 -20 44 4C42 30 26 46 6 44C-12 42 -14 28 -8 18C-4 12 -4 -10 -8 -16C-16 -30 -10 -44 10 -44Z" /><path class="ln brand" d="M12 -34C28 -32 36 -14 34 4C32 22 22 34 8 34" opacity=".7" stroke-dasharray="2 3" /><path class="ln brand tint2-brand" d="M16 -22L26 -12L14 -6ZM18 2L30 4L18 12ZM14 22L24 28L10 30Z" /><path class="ln brand" d="M-4 -10C6 -8 8 18 -4 20" /><path class="ln brand" d="M-6 18C-10 26 -16 36 -18 54" /></g><g transform="translate(492 154) scale(0.9)"><path class="ln brand tint2-brand" d="M0 -12C5 -4 8 0 8 4A8 8 0 0 1 -8 4C-8 0 -5 -4 0 -12Z" /></g>
