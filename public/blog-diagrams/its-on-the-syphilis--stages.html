    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" width="680" height="214">
      <title>The four stages of untreated syphilis</title>
      <desc>
        Untreated syphilis moves through four stages. The primary stage is a painless sore where it
        entered, about three weeks after exposure. The secondary stage brings a rash, often on the
        palms and soles, over weeks to months. The latent stage has no signs for years but the
        person is still infected. In some people a tertiary stage, years to decades later, damages
        the heart or nervous system.
      </desc>

      <text class="label-secondary" x="95" y="185" text-anchor="middle">a painless sore</text>

      <text class="label-primary" x="415" y="168" text-anchor="middle">Latent</text>
