    aria-label="Untreated syphilis moves through four stages. In the primary stage a sore appears where it entered and lasts 3 to 6 weeks. The secondary stage brings a rash, which can be on the palms and soles, starting as the sore heals or several weeks later. The latent stage has no visible signs or symptoms. A tertiary stage, 10 to 30 years after infection began, can damage the heart and blood vessels and the brain and nervous system."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230">
      <title>The four stages of untreated syphilis</title>
      <desc>
        Untreated syphilis moves through four stages. In the primary stage a sore appears where it
        entered and lasts 3 to 6 weeks. The secondary stage brings a rash, which can be on the palms
        and soles, starting as the sore heals or several weeks later. The latent stage has no
        visible signs or symptoms. A tertiary stage, 10 to 30 years after infection began, can
        damage the heart and blood vessels and the brain and nervous system.
      </desc>

      <text class="label-secondary" x="95" y="138" text-anchor="middle">sore lasts</text>
      <text class="label-secondary" x="95" y="153" text-anchor="middle">3 to 6 weeks</text>
      <text class="label-primary" x="95" y="184" text-anchor="middle">Primary</text>
      <text class="label-secondary" x="95" y="201" text-anchor="middle">a sore where</text>

      <circle class="ln brand" cx="255" cy="118" r="4" />

      <text class="label-primary" x="255" y="184" text-anchor="middle">Secondary</text>
      <text class="label-secondary" x="255" y="201" text-anchor="middle">
        a rash, which can be on
      </text>
      <text class="label-secondary" x="255" y="216" text-anchor="middle">palms and soles</text>
      <circle class="ln brand" cx="415" cy="118" r="4" />
      <text class="label-secondary" x="415" y="138" text-anchor="middle">no visible</text>
      <text class="label-secondary" x="415" y="153" text-anchor="middle">signs</text>
      <text class="label-primary" x="415" y="184" text-anchor="middle">Latent</text>
      <text class="label-secondary" x="415" y="201" text-anchor="middle">no symptoms,</text>

      <text class="label-secondary" x="575" y="216" text-anchor="middle">
        vessels, brain, nerves
      </text>
