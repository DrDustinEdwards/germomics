      <title>SARS coronavirus: spike, receptor and host range</title>

        human cell, like a key in a lock. The 2002 to 2003 outbreak in people was followed by the
        discovery of related coronaviruses in bats, and of a closely related virus in palm civets
        sold in markets in southern China.
