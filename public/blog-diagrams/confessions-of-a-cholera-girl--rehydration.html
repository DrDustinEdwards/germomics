      <title>Why oral rehydration works in cholera</title>

        leave the cell. The transporter that pulls sodium in together with glucose still works. An
        oral rehydration solution with glucose and salt uses that transporter, and water follows the
        sodium into the cell.
      </desc>

      <text class="label-primary" x="168" y="250" text-anchor="middle">With cholera toxin</text>
      <text class="label-secondary" x="168" y="268" text-anchor="middle">
