<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Cholera toxin keeps a chloride channel in the gut cell membrane open, so chloride and water leave the cell. The transporter that pulls sodium in together with glucose still works. An oral rehydration solution with glucose and salt uses that transporter, and water follows the sodium into the cell."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250">
      <title>Why oral rehydration works in cholera</title>
      <desc>
        Cholera toxin keeps a chloride channel in the gut cell membrane open, so chloride and water
        leave the cell. The transporter that pulls sodium in together with glucose still works. An
        oral rehydration solution with glucose and salt uses that transporter, and water follows the
        sodium into the cell.
      </desc>
      <path class="ln" d="M30 120H105M165 120H420M30 130H105M165 130H420M470 120H650M470 130H650" />
      <path
        class="ln muted"
        d="M105 120C97 120 97 130 105 130M165 120C173 120 173 130 165 130M420 120C428 120 428 130 420 130M470 120C462 120 462 130 470 130"
      />
      <g class="m-slide" style="--i: 0; --fx: 0px; --fy: 18px">
        <path class="ln brand" d="M135 150L135 84" />
        <g transform="translate(135 84) rotate(-90.0)">
          <path class="ln brand" d="M-4 -6L3 0L-4 6" />
        </g>
      </g>
      <text class="label-primary" x="135" y="70" text-anchor="middle">Cl⁻</text>
      <g class="m-slide" style="--i: 1; --fx: 0px; --fy: 14px">
        <path class="ln brand" d="M188 150L188 98" stroke-dasharray="3 4" />
        <g transform="translate(188 98) rotate(-90.0)">
          <path class="ln brand" d="M-4 -6L3 0L-4 6" />
        </g>
      </g>
      <text class="label-secondary" x="188" y="86" text-anchor="middle">H₂O</text>
      <g class="m-slide" style="--i: 0; --fx: 0px; --fy: -18px">
        <path class="ln accent" d="M445 84L445 150" />
        <g transform="translate(445 150) rotate(90.0)">
          <path class="ln accent" d="M-4 -6L3 0L-4 6" />
        </g>
      </g>
      <text class="label-primary" x="445" y="70" text-anchor="middle">Na⁺ + glucose</text>
      <g class="m-slide" style="--i: 1; --fx: 0px; --fy: -14px">
        <path class="ln accent" d="M500 98L500 150" stroke-dasharray="3 4" />
        <g transform="translate(500 150) rotate(90.0)">
          <path class="ln accent" d="M-4 -6L3 0L-4 6" />
        </g>
      </g>
      <text class="label-secondary" x="500" y="86" text-anchor="middle">H₂O</text>
      <g transform="translate(600 62)">
        <path class="ln" d="M-16 -22H16L12 18H-12Z" />
        <path class="ln accent" d="M-13 -4 q3.25 -6 6.5 0 t6.5 0 q3.25 -6 6.5 0 t6.5 0" />
      </g>
      <path class="ln muted" d="M580 60L530 60" />
      <g transform="translate(530 60) rotate(180.0)">
        <path class="ln muted" d="M-4 -6L3 0L-4 6" />
      </g>
      <text class="label-primary" x="150" y="206" text-anchor="middle">With cholera toxin</text>
      <text class="label-secondary" x="150" y="224" text-anchor="middle">
        the chloride channel stays open:
      </text>
      <text class="label-secondary" x="150" y="239" text-anchor="middle">
        chloride and water leave
      </text>
      <text class="label-primary" x="500" y="206" text-anchor="middle">
        Oral rehydration solution
      </text>
      <text class="label-secondary" x="500" y="224" text-anchor="middle">
        glucose still carries sodium in,
      </text>
      <text class="label-secondary" x="500" y="239" text-anchor="middle">and water follows</text>
    </svg>
  </figure>
  <p class="blog-diagram-credit">
    Sources:
    <a href="https://doi.org/10.1172/JCI18326">Field, Journal of Clinical Investigation (2003)</a>.
  </p>
</div>
