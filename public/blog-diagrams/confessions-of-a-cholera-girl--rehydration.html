<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Cholera toxin keeps a chloride channel in the gut cell membrane open, so chloride and water leave the cell. The transporter that pulls sodium in together with glucose still works. An oral rehydration solution with glucose and salt uses that transporter, and water follows the sodium into the cell."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240">
      <title>Why oral rehydration works in cholera</title>
      <desc>
        Cholera toxin keeps a chloride channel in the gut cell membrane open, so chloride and water
        leave the cell. The transporter that pulls sodium in together with glucose still works. An
        oral rehydration solution with glucose and salt uses that transporter, and water follows the
        sodium into the cell.
      </desc>
      <path class="ln" d="M20 110H154.0M176.0 110H310M20 122H154.0M176.0 122H310" />
      <rect class="ln brand tint-brand" x="146.0" y="105" width="8" height="22" rx="4" />
      <rect class="ln brand tint-brand" x="176.0" y="105" width="8" height="22" rx="4" />
      <text class="label-secondary" x="24" y="96" text-anchor="start">gut lumen</text>
      <text class="label-secondary" x="24" y="146" text-anchor="start">inside the cell</text>
      <g class="m-slide" style="--i: 0; --fx: 0px; --fy: 18px">
        <path class="ln brand" d="M165 134L165 64" />
        <g transform="translate(165 64) rotate(-90.0)">
          <path class="ln brand" d="M-4 -6L3 0L-4 6" />
        </g>
      </g>
      <text class="label-primary" x="165" y="50" text-anchor="middle">Cl⁻ leaves</text>
      <g class="m-slide" style="--i: 1; --fx: 0px; --fy: 14px">
        <path class="ln brand" d="M228 134L228 80" stroke-dasharray="3 4" />
        <g transform="translate(228 80) rotate(-90.0)">
          <path class="ln brand" d="M-4 -6L3 0L-4 6" />
        </g>
      </g>
      <text class="label-secondary" x="228" y="68" text-anchor="middle">water follows</text>
      <text class="label-primary" x="165" y="192" text-anchor="middle">With cholera toxin</text>
      <text class="label-secondary" x="165" y="210" text-anchor="middle">
        the chloride channel stays open,
      </text>
      <text class="label-secondary" x="165" y="225" text-anchor="middle">
        so chloride and water pour out
      </text>
      <path class="ln rule-line muted" d="M340 30V230" stroke-dasharray="2 5" />
      <path class="ln" d="M370 110H464.0M486.0 110H660M370 122H464.0M486.0 122H660" />
      <rect class="ln accent tint-accent" x="456.0" y="105" width="8" height="22" rx="4" />
      <rect class="ln accent tint-accent" x="486.0" y="105" width="8" height="22" rx="4" />
      <text class="label-secondary" x="374" y="96" text-anchor="start">gut lumen</text>
      <text class="label-secondary" x="374" y="146" text-anchor="start">inside the cell</text>
      <g class="m-slide" style="--i: 0; --fx: 0px; --fy: -18px">
        <path class="ln accent" d="M475 60L475 134" />
        <g transform="translate(475 134) rotate(90.0)">
          <path class="ln accent" d="M-4 -6L3 0L-4 6" />
        </g>
      </g>
      <text class="label-primary" x="475" y="50" text-anchor="middle">Na⁺ and glucose enter</text>
      <g class="m-slide" style="--i: 1; --fx: 0px; --fy: -14px">
        <path class="ln accent" d="M560 80L560 134" stroke-dasharray="3 4" />
        <g transform="translate(560 134) rotate(90.0)">
          <path class="ln accent" d="M-4 -6L3 0L-4 6" />
        </g>
      </g>
      <text class="label-secondary" x="560" y="68" text-anchor="middle">water follows</text>
      <g transform="translate(610 40)">
        <path class="ln" d="M-14 -16H14L10 16H-10Z" />
        <path class="ln accent" d="M-11 -3 q2.75 -6 5.5 0 t5.5 0 q2.75 -6 5.5 0 t5.5 0" />
      </g>
      <text class="label-primary" x="475" y="192" text-anchor="middle">
        Oral rehydration solution
      </text>
      <text class="label-secondary" x="475" y="210" text-anchor="middle">
        glucose still carries sodium in,
      </text>
      <text class="label-secondary" x="475" y="225" text-anchor="middle">
        and water goes with it
      </text>
    </svg>
  </figure>
  <p class="blog-diagram-credit">
    Sources:
    <a href="https://doi.org/10.1172/JCI18326">Field, Journal of Clinical Investigation (2003)</a>.
  </p>
</div>
