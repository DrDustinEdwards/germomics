    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="680" height="210">

        the cell lets chloride out while taking up less sodium.
      </desc>

          id="arrow-confessionsofacholeragirl"

          refY="5"

          <path d="M0 0 L10 5 L0 10 Z" class="arrow-head" />
        </marker>
      </defs>

      <g class="node-accent">
        <circle class="bead" cx="92" cy="58" r="9" />
        <circle class="bead" cx="112" cy="48" r="9" />
        <circle class="bead" cx="132" cy="58" r="9" />
        <circle class="bead" cx="102" cy="74" r="9" />

        <path class="glyph" d="M104 90 L120 86" />

      </g>
      <g class="node-warning">

        <text class="label-primary" x="276" y="200" text-anchor="middle">A1 locks Gs on</text>
      </g>
      <g class="node-info">

          class="connector"

          marker-end="url(#arrow-confessionsofacholeragirl)"
        />
        <text class="label-primary" x="540" y="146" text-anchor="middle">Chloride out</text>
        <path
          class="connector quiet"
          d="M470 176 H400"
          marker-end="url(#arrow-confessionsofacholeragirl)"
        />
        <text class="label-secondary" x="540" y="180" text-anchor="middle">Less sodium in</text>
