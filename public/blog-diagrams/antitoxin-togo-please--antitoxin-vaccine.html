<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Antitoxin is borrowed antibodies: an animal is immunized, and its serum is given to a patient who is already infected, which neutralizes the toxin now. A vaccine uses a harmless form of the toxin, a toxoid, so the person's own cells make antibodies and keep a memory that lasts years, with boosters."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310">
      <title>Antitoxin and vaccine are different protection</title>
      <desc>
        Antitoxin is borrowed antibodies: an animal is immunized, and its serum is given to a
        patient who is already infected, which neutralizes the toxin now. A vaccine uses a harmless
        form of the toxin, a toxoid, so the person's own cells make antibodies and keep a memory
        that lasts years, with boosters.
      </desc>
      <text class="label-primary" x="30" y="72" text-anchor="start">Antitoxin</text>
      <text class="label-secondary" x="30" y="90" text-anchor="start">borrowed antibodies,</text>
      <text class="label-secondary" x="30" y="105" text-anchor="start">given after infection</text>
      <text class="label-primary" x="30" y="216" text-anchor="start">Vaccine</text>
      <text class="label-secondary" x="30" y="234" text-anchor="start">the body makes its own</text>
      <text class="label-secondary" x="30" y="249" text-anchor="start">before infection</text>
      <path class="rule" d="M30 150H650" />
      <g transform="translate(280 74)">
        <path class="ln" d="M-11 -22H11V-18H9V20C9 24 -9 24 -9 20V-18H-11Z" />
        <path class="ln accent tint2-accent" d="M-9 -2H9V20C9 24 -9 24 -9 20Z" />
      </g>
      <g class="m-fade" style="--i: 0">
        <g transform="translate(280 78)">
          <g transform="translate(0 0) scale(0.8)">
            <path
              class="ln accent tint2-accent"
              d="M-2 14V2L-11 -10L-7 -13L0 -3L7 -13L11 -10L2 2V14Z"
            />
          </g>
        </g>
      </g>
      <text class="label-secondary" x="280" y="126" text-anchor="middle">
        serum with antibodies
      </text>
      <text class="label-secondary" x="280" y="141" text-anchor="middle">
        from an immunized animal
      </text>
      <path class="ln muted" d="M318 74L372 74" />
      <g transform="translate(372 74)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(430 70) scale(1.1)">
        <circle class="ln" cx="0" cy="-14" r="6.5" />
        <path
          class="ln tint-brand"
          d="M-5 -6.5H5C10 -6.5 12 -3 12 1L13 14H8L7 30H1.5L0 15L-1.5 30H-7L-8 14H-13L-12 1C-12 -3 -10 -6.5 -5 -6.5Z"
        />
      </g>
      <g class="m-fade" style="--i: 1">
        <g transform="translate(470 60)">
          <g transform="translate(0 0)">
            <path
              class="ln accent tint2-accent"
              d="M-2 14V2L-11 -10L-7 -13L0 -3L7 -13L11 -10L2 2V14Z"
            />
          </g>
        </g>
        <g transform="translate(488 76)">
          <g transform="translate(0 0)">
            <path
              class="ln accent tint2-accent"
              d="M-2 14V2L-11 -10L-7 -13L0 -3L7 -13L11 -10L2 2V14Z"
            />
          </g>
        </g>
      </g>
      <text class="label-secondary" x="430" y="126" text-anchor="middle">given to the patient</text>
      <path class="ln muted" d="M512 74L560 74" />
      <g transform="translate(560 74)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(600 74)">
        <circle class="ln brand tint2-brand" r="12" />
        <g transform="translate(-16 -14) rotate(-40)">
          <g transform="translate(0 0) scale(0.9)">
            <path
              class="ln accent tint2-accent"
              d="M-2 14V2L-11 -10L-7 -13L0 -3L7 -13L11 -10L2 2V14Z"
            />
          </g>
        </g>
        <g transform="translate(16 -14) rotate(40)">
          <g transform="translate(0 0) scale(0.9)">
            <path
              class="ln accent tint2-accent"
              d="M-2 14V2L-11 -10L-7 -13L0 -3L7 -13L11 -10L2 2V14Z"
            />
          </g>
        </g>
      </g>
      <text class="label-secondary" x="600" y="126" text-anchor="middle">
        antibodies bind the toxin;
      </text>
      <text class="label-secondary" x="600" y="141" text-anchor="middle">it is blocked now</text>
      <g transform="translate(280 218)">
        <circle class="ln brand tint-brand" r="16" />
        <path class="ln brand" d="M-8 8L8 -8" />
      </g>
      <text class="label-secondary" x="280" y="270" text-anchor="middle">toxoid: the toxin,</text>
      <text class="label-secondary" x="280" y="285" text-anchor="middle">made harmless</text>
      <path class="ln muted" d="M318 218L372 218" />
      <g transform="translate(372 218)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(430 214) scale(1.1)">
        <circle class="ln" cx="0" cy="-14" r="6.5" />
        <path
          class="ln tint-brand"
          d="M-5 -6.5H5C10 -6.5 12 -3 12 1L13 14H8L7 30H1.5L0 15L-1.5 30H-7L-8 14H-13L-12 1C-12 -3 -10 -6.5 -5 -6.5Z"
        />
      </g>
      <g class="m-fade" style="--i: 1">
        <g transform="translate(470 204)">
          <g transform="translate(0 0)">
            <path
              class="ln accent tint2-accent"
              d="M-2 14V2L-11 -10L-7 -13L0 -3L7 -13L11 -10L2 2V14Z"
            />
          </g>
        </g>
        <g transform="translate(488 220)">
          <g transform="translate(0 0)">
            <path
              class="ln accent tint2-accent"
              d="M-2 14V2L-11 -10L-7 -13L0 -3L7 -13L11 -10L2 2V14Z"
            />
          </g>
        </g>
        <g transform="translate(474 234)">
          <g transform="translate(0 0)">
            <path
              class="ln accent tint2-accent"
              d="M-2 14V2L-11 -10L-7 -13L0 -3L7 -13L11 -10L2 2V14Z"
            />
          </g>
        </g>
      </g>
      <text class="label-secondary" x="430" y="270" text-anchor="middle">
        the patient's own cells
      </text>
      <text class="label-secondary" x="430" y="285" text-anchor="middle">make the antibodies</text>
      <path class="ln muted" d="M516 218L562 218" />
      <g transform="translate(562 218)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(602 218)">
        <circle class="ln accent tint-accent" r="14" />
        <circle class="ln accent tint2-accent" r="5" />
        <path class="ln accent" d="M-8 -22L0 -16L8 -22" />
      </g>
      <text class="label-secondary" x="602" y="270" text-anchor="middle">memory lasts years;</text>
      <text class="label-secondary" x="602" y="285" text-anchor="middle">boosters keep it up</text>
    </svg>
  </figure>
