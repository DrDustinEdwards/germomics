<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Antitoxin is borrowed antibodies: an animal is immunized, and its serum is given to a patient who is already infected, which neutralizes the toxin now. A vaccine uses a harmless form of the toxin, a toxoid, so the person's own cells make antibodies and keep a memory that lasts years, with boosters."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280">
      <title>Antitoxin and vaccine are different protection</title>
      <desc>
        Antitoxin is borrowed antibodies: an animal is immunized, and its serum is given to a
        patient who is already infected, which neutralizes the toxin now. A vaccine uses a harmless
        form of the toxin, a toxoid, so the person's own cells make antibodies and keep a memory
        that lasts years, with boosters.
      </desc>
      <text class="label-primary" x="30" y="66" text-anchor="start">Antitoxin</text>
      <text class="label-secondary" x="30" y="84" text-anchor="start">borrowed antibodies,</text>
      <text class="label-secondary" x="30" y="99" text-anchor="start">given after infection</text>
      <text class="label-primary" x="30" y="186" text-anchor="start">Vaccine</text>
      <text class="label-secondary" x="30" y="204" text-anchor="start">the body makes its own</text>
      <text class="label-secondary" x="30" y="219" text-anchor="start">before infection</text>
      <g transform="translate(300 66)">
        <circle class="ln" r="26" />
        <g transform="translate(-10 8)"><path class="ln accent" d="M0 8V0M0 0L-6 -8M0 0L6 -8" /></g>
        <g transform="translate(8 6)"><path class="ln accent" d="M0 8V0M0 0L-6 -8M0 0L6 -8" /></g>
        <g transform="translate(-2 -8)"><path class="ln accent" d="M0 8V0M0 0L-6 -8M0 0L6 -8" /></g>
      </g>
      <text class="label-secondary" x="300" y="112" text-anchor="middle">a horse makes</text>
      <text class="label-secondary" x="300" y="127" text-anchor="middle">antibodies</text>
      <path class="ln muted" d="M336 66L394 66" />
      <g transform="translate(394 66)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(450 70)">
        <circle class="ln" cx="0" cy="-14" r="6.5" />
        <path
          class="ln tint-brand"
          d="M-5 -6.5H5C10 -6.5 12 -3 12 1L13 14H8L7 30H1.5L0 15L-1.5 30H-7L-8 14H-13L-12 1C-12 -3 -10 -6.5 -5 -6.5Z"
        />
      </g>
      <g class="m-fade" style="--i: 0">
        <g transform="translate(486 58)">
          <path class="ln accent" d="M0 8V0M0 0L-6 -8M0 0L6 -8" />
        </g>
      </g>
      <g class="m-fade" style="--i: 1">
        <g transform="translate(500 70)">
          <path class="ln accent" d="M0 8V0M0 0L-6 -8M0 0L6 -8" />
        </g>
      </g>
      <text class="label-secondary" x="450" y="112" text-anchor="middle">serum given</text>
      <text class="label-secondary" x="450" y="127" text-anchor="middle">to the patient</text>
      <path class="ln muted" d="M516 66L570 66" />
      <g transform="translate(570 66)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(606 60)">
        <circle class="ln brand tint-brand" r="12" />
        <path class="ln brand" d="M-6 -6L6 6M6 -6L-6 6" />
      </g>
      <text class="label-secondary" x="606" y="112" text-anchor="middle">toxin blocked now</text>
      <g transform="translate(300 186)">
        <circle class="ln brand tint-brand" r="16" />
        <path class="ln brand" d="M-8 8L8 -8" />
      </g>
      <text class="label-secondary" x="300" y="232" text-anchor="middle">toxoid:</text>
      <text class="label-secondary" x="300" y="247" text-anchor="middle">toxin made harmless</text>
      <path class="ln muted" d="M336 186L394 186" />
      <g transform="translate(394 186)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(450 190)">
        <circle class="ln" cx="0" cy="-14" r="6.5" />
        <path
          class="ln tint-brand"
          d="M-5 -6.5H5C10 -6.5 12 -3 12 1L13 14H8L7 30H1.5L0 15L-1.5 30H-7L-8 14H-13L-12 1C-12 -3 -10 -6.5 -5 -6.5Z"
        />
      </g>
      <g class="m-fade" style="--i: 0">
        <g transform="translate(486 178)">
          <path class="ln accent" d="M0 8V0M0 0L-6 -8M0 0L6 -8" />
        </g>
      </g>
      <g class="m-fade" style="--i: 1">
        <g transform="translate(500 190)">
          <path class="ln accent" d="M0 8V0M0 0L-6 -8M0 0L6 -8" />
        </g>
      </g>
      <g class="m-fade" style="--i: 2">
        <g transform="translate(512 178)">
          <path class="ln accent" d="M0 8V0M0 0L-6 -8M0 0L6 -8" />
        </g>
      </g>
      <text class="label-secondary" x="450" y="232" text-anchor="middle">own cells make</text>
      <text class="label-secondary" x="450" y="247" text-anchor="middle">the antibodies</text>
      <path class="ln muted" d="M530 186L574 186" />
      <g transform="translate(574 186)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <g transform="translate(606 182)">
        <circle class="ln accent tint-accent" r="12" />
        <path class="ln accent" d="M-5 0L-1 4L6 -4" />
      </g>
      <text class="label-secondary" x="606" y="232" text-anchor="middle">memory lasts years;</text>
      <text class="label-secondary" x="606" y="247" text-anchor="middle">boosters keep it up</text>
      <path class="rule" d="M30 128H650" />
    </svg>
  </figure>
