<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="After a bite, rabies virus travels back along a nerve toward the central nervous system, a time that varies from weeks to months and sometimes longer. Before symptoms begin, post-exposure treatment can stop the disease. Once symptoms begin, rabies is almost always fatal."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" width="680" height="232">
      <title>Rabies: the window before symptoms</title>
      <desc>
        After a bite, rabies virus travels back along a nerve toward the central nervous system, a
        time that varies from weeks to months and sometimes longer. Before symptoms begin,
        post-exposure treatment can stop the disease. Once symptoms begin, rabies is almost always
        fatal.
      </desc>
      <path class="ln" d="M50 130H640" />
      <g transform="translate(640 130)"><path class="ln muted" d="M-4 -6L3 0L-4 6" /></g>
      <circle class="ln brand tint-brand" cx="80" cy="130" r="6" />
      <circle class="ln brand tint-brand" cx="400" cy="130" r="6" />
      <circle class="ln brand tint-brand" cx="460" cy="130" r="6" />
      <text class="label-primary" x="80" y="154" text-anchor="middle">bite</text>
      <text class="label-primary" x="400" y="154" text-anchor="end">reaches the central</text>
      <text class="label-primary" x="400" y="170" text-anchor="end">nervous system</text>
      <text class="label-primary" x="460" y="154" text-anchor="start">symptoms begin</text>
      <path class="ln brand" d="M80 96H400" />
      <g class="m-slide" style="--i: 0; --fx: -90px; --fy: 0px">
        <g transform="translate(180 96)">
          <path class="ln brand tint-brand" d="M-8 -5H1C8 -5 8 5 1 5H-8Z" />
        </g>
        <g transform="translate(260 96)">
          <path class="ln brand tint-brand" d="M-8 -5H1C8 -5 8 5 1 5H-8Z" />
        </g>
        <g transform="translate(340 96)">
          <path class="ln brand tint-brand" d="M-8 -5H1C8 -5 8 5 1 5H-8Z" />
        </g>
      </g>
      <text class="label-secondary" x="240" y="84" text-anchor="middle">
        virus travels back along the nerve
      </text>
      <path class="ln accent" d="M80 62V52H400V62" />
      <text class="label-primary" x="240" y="40" text-anchor="middle">
        Before symptoms: treatment can stop it
      </text>
      <path class="ln brand" d="M460 62V52H630V62" />
      <text class="label-primary" x="545" y="40" text-anchor="middle">
        After: almost always fatal
      </text>
      <text class="label-secondary" x="80" y="218" text-anchor="start">
        time varies: weeks to months, sometimes longer
      </text>
      <path class="ln muted" d="M80 202H400" stroke-dasharray="3 4" />
    </svg>
  </figure>

      >Fooks and colleagues, Nature Reviews Disease Primers (2017)</a
    >.
  </p>
</div>
