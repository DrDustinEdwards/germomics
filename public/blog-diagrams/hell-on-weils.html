<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Reservoir kidney leads to Shed in urine, which leads to Fresh water and wet soil. That water and soil lead back to Reservoir kidney, and also to Broken skin or a mucous membrane. Infected mammals, rats in particular, can carry Leptospira in the kidney and shed it in urine. A person is exposed the same way and is not what keeps the cycle going. Some infections cause no illness. Weil's disease is a severe form."
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="107 0 917 572" width="917" height="572">
      <title>Leptospirosis: reservoir, environment, exposure</title>
      <desc>
        Reservoir kidney leads to Shed in urine, which leads to Fresh water and wet soil. That water
        and soil lead back to Reservoir kidney, and also to Broken skin or a mucous membrane.
        Infected mammals, rats in particular, can carry Leptospira in the kidney and shed it in
        urine. A person is exposed the same way and is not what keeps the cycle going. Some
        infections cause no illness. Weil's disease is a severe form.
      </desc>
