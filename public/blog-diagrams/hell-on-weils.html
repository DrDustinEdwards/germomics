<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Leptospira is maintained in a mammal kidney, shed in urine into fresh water and wet soil, and can return to another reservoir host. A person meets it through broken skin or a mucous membrane and does not keep the cycle going."

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352">
      <title>Leptospirosis: reservoir, environment, exposure</title>
      <desc>

        and can return to another reservoir host. A person meets it through broken skin or a mucous
        membrane and does not keep the cycle going.
      </desc>

        Reservoir kidney
      </text>
      <text class="label-secondary m-fade" style="--i: 0" x="232" y="79" text-anchor="start">
        mammals, rats especially
      </text>
      <path class="ln muted" d="M140 114V148" />
      <path class="ln muted" d="M134 142l6 8l6-8" />
      <path
        class="ln accent tint-accent"
        d="M140 156C126 174 126 188 140 192C154 188 154 174 140 156Z"
      />
      <text class="label-primary m-fade" style="--i: 1" x="172" y="180" text-anchor="start">
        Shed in urine
      </text>
      <path class="ln muted" d="M140 196V228" />
      <path class="ln muted" d="M134 222l6 8l6-8" />
      <path class="ln accent" d="M60 252q20 -10 40 0t40 0t40 0t40 0" />
      <path class="ln accent" d="M60 264q20 -10 40 0t40 0t40 0t40 0" />
      <path class="ln accent" d="M60 276q20 -10 40 0t40 0t40 0t40 0" />
      <text class="label-primary m-fade" style="--i: 1" x="232" y="262" text-anchor="start">
        Fresh water and wet soil
      </text>
      <path class="ln muted" stroke-dasharray="3 4" d="M62 258C20 220 20 110 92 84" />
      <path class="ln muted" d="M82 80l10 4l-6 9" />
      <text class="label-secondary m-fade" style="--i: 2" x="14" y="300" text-anchor="start">
        back to another reservoir host
      </text>
      <path class="ln muted" d="M430 262H478" />
      <path class="ln muted" d="M472 256l8 6l-8 6" />
      <circle class="ln" cx="540" cy="238" r="10" />

      </text>
