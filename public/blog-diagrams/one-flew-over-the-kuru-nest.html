<div class="blog-diagram-block">
  <figure
    class="blog-diagram"
    role="img"
    aria-label="Prion templating. Cells make the normal protein PrPC. PrPSc can refold more PrPC into PrPSc, and that misfolded form can spread."

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="680" height="190">
      <title>Prion templating</title>
      <desc>
        Prion templating. Cells make the normal protein PrPC. PrPSc can refold more PrPC into PrPSc,
        and that misfolded form can spread.
      </desc>
      <defs>
        <marker
          id="arrow-oneflewoverthekurunest"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="6"
          markerHeight="6"
          orient="auto-start-reverse"
        >
          <path d="M0 0 L10 5 L0 10 Z" class="arrow-head" />
        </marker>
      </defs>
      <g class="node-neutral">
        <rect x="24" y="20" width="160" height="140" rx="8" />
        <path class="glyph" d="M40 70 C58 48 74 48 92 70 C110 92 126 92 144 70" />
        <text class="label-primary" x="104.0" y="132" text-anchor="middle">Cells make PrPC</text>
        <text class="label-secondary" x="104.0" y="148" text-anchor="middle">
          the normal protein
        </text>
      </g>
      <path d="M184 90 H186" class="connector" marker-end="url(#arrow-oneflewoverthekurunest)" />
      <g class="node-warning">
        <rect x="186" y="20" width="160" height="140" rx="8" />
        <path class="glyph" d="M196 78 L210 56 L226 86 L242 52 L258 82" />
        <path class="glyph quiet" d="M204 100 C222 82 240 82 258 100" />
        <text class="label-primary" x="266.0" y="132" text-anchor="middle">
          PrPSc templates more
        </text>
        <text class="label-secondary" x="266.0" y="148" text-anchor="middle">more PrPSc</text>
      </g>
      <path d="M346 90 H348" class="connector" marker-end="url(#arrow-oneflewoverthekurunest)" />
      <g class="node-accent">
        <rect x="348" y="20" width="160" height="140" rx="8" />
        <path class="glyph" d="M360 60 L372 46 L386 70 L400 44" />
        <path class="glyph" d="M366 90 L380 76 L396 102" />
        <path class="glyph" d="M358 118 L372 104 L388 126 L404 108" />
        <text class="label-primary" x="428.0" y="132" text-anchor="middle">The misfolded form</text>
        <text class="label-secondary" x="428.0" y="148" text-anchor="middle">can spread</text>
      </g>
    </svg>
  </figure>
